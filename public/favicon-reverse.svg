<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;display=swap');
      .monogram {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 44px;
        font-weight: 600;
        fill: #F7F1E9;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  <!-- Rounded Square Body in Deep Burgundy -->
  <rect width="64" height="64" rx="16" fill="#722F37"/>
  <!-- Hairline Inner Border in Subtle Cream Tint -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="rgba(247, 241, 233, 0.25)" stroke-width="1.2"/>
  <!-- Refined Cream Serif T Monogram -->
  <text x="32" y="34" class="monogram">T</text>
</svg>
